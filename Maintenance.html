<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Management Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --btn-brown: #5d3d1e;
      --btn-hover: #452c13;
      --border-color: #e2e8f0;
      --table-header: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group h1 { font-size: 20px; font-weight: 700; }
    .title-group p { font-size: 13px; color: var(--text-muted); }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    /* Scrollable responsive tabs container */
    .tabs-wrapper {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .tabs {
      display: inline-flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--btn-brown);
      border-bottom-color: var(--btn-brown);
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="date"], input[type="text"], input[type="file"] {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      max-width: 100%;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-brown { background-color: var(--btn-brown); color: #fff; }
    .btn-brown:hover { background-color: var(--btn-hover); }
    .btn-red { background-color: #ef4444; color: #fff; }
    .btn-red:hover { background-color: #dc2626; }
    .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background-color: #f1f5f9; }

    .table-container { 
      width: 100%;
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
      min-width: 850px;
    }

    th {
      background-color: var(--table-header);
      padding: 10px 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
    }

    tr:hover { background-color: #f8fafc; }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }

    .badge-Pending { background: #fef3c7; color: #92400e; }
    .badge-Rescheduled { background: #eff6ff; color: #1d4ed8; }
    .badge-Resolved { background: #dcfce7; color: #15803d; }
    .badge-Rejected { background: #fee2e2; color: #991b1b; }

    .photo-link { color: var(--btn-brown); font-weight: 600; text-decoration: none; }
    .photo-link:hover { text-decoration: underline; }

    /* Compact Collapsible Reschedule Box */
    .reschedule-box {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      flex-direction: column;
      gap: 6px;
      width: 180px;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 140px;
    }
.brand-header { text-align: center; margin-bottom: 20px;}
.brand-header h1 { font-size: 22px; font-weight: 700;}
    .brand-logo-img {
      max-width: 140px;
      height: auto;
      margin-bottom: 10px;
      object-fit: contain;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      body { padding: 10px; }
      .header-bar { flex-direction: column; align-items: flex-start; }
      .title-group h1 { font-size: 18px; }
      .filter-bar { width: 100%; }
      .filter-group { width: 100%; justify-content: space-between; }
      input[type="date"] { width: 100%; }
    }
  </style>
</head>
<body>
<div class="brand-header">
    <!-- <img src="logo.png" alt="Company Logo" class="brand-logo-img"> -->
    <h1>Maintenance Dashboard</h1>
    <p>Track, reschedule, and resolve technician complaints</p>
  </div>
<div class="header-bar">
  <div class="title-group">
  </div>
  <div>
    <button class="btn btn-outline" onclick="exportExcel()">Export to Excel</button>
  </div>
</div>

<div class="card">
  <!-- Scrollable tabs container prevents overlap on mobile -->
  <div class="tabs-wrapper">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('Pending', event)">Pending</button>
      <button class="tab-btn" onclick="switchTab('Rescheduled', event)">Rescheduled</button>
      <button class="tab-btn" onclick="switchTab('Resolved', event)">Resolved</button>
      <button class="tab-btn" onclick="switchTab('Rejected', event)">Rejected</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <label style="font-size: 12px; font-weight:600;">From:</label>
      <input type="date" id="startDate">
    </div>
    <div class="filter-group">
      <label style="font-size: 12px; font-weight:600;">To:</label>
      <input type="date" id="endDate">
    </div>
    <button class="btn btn-brown" onclick="renderTable()">Filter</button>
    <button class="btn btn-outline" onclick="resetFilter()">Reset</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Logged Date</th>
          <th>Tech ID</th>
          <th>Location</th>
          <th>Category</th>
          <th>Description</th>
          <th>Photo</th>
          <th id="thDynamicMeta">Schedule / Reason</th>
          <th>Status</th>
          <th id="thDynamicAction">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyyTa1qfw_uDU3TnVg6KchVuH_3B1FjKMXsQVAcCY49zKGq32OLqadSGR9wcY39QGZj/exec";
  let dataset = [];
  let currentTab = 'Pending';
  let isUserInteracting = false;

  function switchTab(tabName, evt) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    evt.target.classList.add('active');
    renderTable();
  }

  async function loadComplaints() {
    if (isUserInteracting) return;

    try {
      const res = await fetch(API_URL);
      dataset = await res.json();
      renderTable();
    } catch (e) {
      console.error(e);
    }
  }

  function toggleRescheduleBox(id) {
    isUserInteracting = true;
    const box = document.getElementById(`resBox-${id}`);
    if (box) {
      const isVisible = box.style.display === 'flex';
      box.style.display = isVisible ? 'none' : 'flex';
    }
  }

function renderTable() {
    if (isUserInteracting) return;

    const tbody = document.getElementById('tableBody');
    const thMeta = document.getElementById('thDynamicMeta');
    const thAction = document.getElementById('thDynamicAction');
    tbody.innerHTML = '';

    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;

    let filtered = dataset.filter(c => {
      let status = (c.status || 'Pending').trim();
      return status.toLowerCase() === currentTab.toLowerCase();
    });

    if (start) filtered = filtered.filter(c => c.date.startsWith(start) || c.date >= start);
    if (end) filtered = filtered.filter(c => c.date.startsWith(end) || c.date <= end);

    if (thMeta && thAction) {
      if (currentTab === 'Pending') {
        thMeta.innerText = "Reschedule";
        thAction.innerText = "Actions";
      } else if (currentTab === 'Rescheduled') {
        thMeta.innerText = "Rescheduled Info";
        thAction.innerText = "Status";
      } else if (currentTab === 'Resolved') {
        thMeta.innerText = "Resolution Info";
        thAction.innerText = "Status";
      } else {
        thMeta.innerText = "Details";
        thAction.innerText = "Status";
      }
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:24px; color:#64748b;">No complaints in ${currentTab}.</td></tr>`;
      return;
    }

    filtered.forEach(c => {
      // Robust photo link renderer
      const renderPhotoLink = (rawUrl) => {
        if (!rawUrl || rawUrl === 'None') return 'None';
        let cleanUrl = String(rawUrl).trim();
        if (cleanUrl.startsWith('=IMAGE("')) {
          cleanUrl = cleanUrl.replace('=IMAGE("', '').replace('")', '');
        }
        if (cleanUrl.startsWith('http')) {
          return `<a href="${cleanUrl}" target="_blank" class="photo-link">View Photo</a>`;
        }
        return 'None';
      };

      const initPhotoHtml = renderPhotoLink(c.photoUrl);

      let metaColumnHtml = '';
      let actionColumnHtml = '';

      if (currentTab === 'Pending') {
        metaColumnHtml = `
          <div>
            <button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="toggleRescheduleBox('${c.id}')">🗓️ Reschedule</button>
            <div id="resBox-${c.id}" class="reschedule-box">
              <input type="date" id="sched-${c.id}" onfocus="isUserInteracting=true">
              <input type="text" id="reason-${c.id}" placeholder="Reason..." onfocus="isUserInteracting=true">
              <div style="display:flex; gap:4px; margin-top:2px;">
                <button class="btn btn-brown" style="padding:4px 8px; font-size:10px; flex:1;" onclick="saveSchedule('${c.id}')">Save</button>
                <button class="btn btn-outline" style="padding:4px 8px; font-size:10px;" onclick="toggleRescheduleBox('${c.id}')">Cancel</button>
              </div>
            </div>
          </div>
        `;
        // Removed double-click focus bug from file picker
        actionColumnHtml = `
          <div class="action-stack">
            <input type="file" id="resPhoto-${c.id}" accept="image/*" onchange="isUserInteracting=true" style="font-size:10px;">
            <button class="btn btn-brown" id="btnDone-${c.id}" style="padding:6px; font-size:11px;" onclick="markDone('${c.id}')">Mark Done</button>
            <button class="btn btn-red" style="padding:4px 6px; font-size:11px;" onclick="rejectComplaint('${c.id}')">Reject</button>
          </div>
        `;
      } else if (currentTab === 'Rescheduled') {
        metaColumnHtml = `
          <div>
            <strong>Date:</strong> ${c.scheduleDate || 'N/A'}<br>
            <span style="font-size:11px; color:#64748b;">Reason: ${c.rescheduleReason || 'N/A'}</span>
          </div>
        `;
        actionColumnHtml = `<span style="color:#1d4ed8; font-weight:600;">Rescheduled</span>`;
      } else if (currentTab === 'Resolved') {
        const resPhotoHtml = renderPhotoLink(c.resolutionPhotoUrl);
        metaColumnHtml = `
          <div>
            <strong>Proof:</strong> ${resPhotoHtml}<br>
            <span style="font-size:11px; color:#15803d;"><strong>Resolved On:</strong> ${c.resolvedDate || 'N/A'}</span>
          </div>
        `;
        actionColumnHtml = `<span style="color:#15803d; font-weight:600;">Completed</span>`;
      } else {
        metaColumnHtml = `<span>Rejected by team</span>`;
        actionColumnHtml = `<span style="color:#dc2626; font-weight:600;">Closed</span>`;
      }

      tbody.innerHTML += `
        <tr>
          <td><b>${c.id}</b></td>
          <td>${c.date}</td>
          <td>${c.techId}</td>
          <td>${c.floor} - ${c.room}</td>
          <td>${c.category}</td>
          <td style="max-width:180px; word-wrap:break-word;">${c.description}</td>
          <td>${initPhotoHtml}</td>
          <td>${metaColumnHtml}</td>
          <td><span class="badge badge-${c.status}">${c.status}</span></td>
          <td>${actionColumnHtml}</td>
        </tr>
      `;
    });
  }

  async function saveSchedule(id) {
    const scheduleDate = document.getElementById(`sched-${id}`).value;
    const reason = document.getElementById(`reason-${id}`).value;

    if (!scheduleDate) return alert('Please select a date.');
    if (!reason.trim()) return alert('Please enter a reason.');

    isUserInteracting = true;
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "schedule", id: id, scheduleDate: scheduleDate, reason: reason })
    });
    isUserInteracting = false;
    loadComplaints();
  }

  async function markDone(id) {
    const fileInput = document.getElementById(`resPhoto-${id}`);
    const btn = document.getElementById(`btnDone-${id}`);

    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      alert('Resolution photo upload is mandatory to mark done.');
      return;
    }

    const file = fileInput.files[0];
    btn.disabled = true;
    btn.innerText = "Uploading...";
    isUserInteracting = true;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.src = evt.target.result;
      img.onload = async function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > 1024) {
          height = Math.round((height * 1024) / width);
          width = 1024;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

        const payload = {
          action: "markDone",
          id: id,
          resolutionPhotoData: compressedBase64,
          resolutionFileName: file.name,
          resolutionMimeType: 'image/jpeg'
        };

        try {
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
        } catch(err) {
          console.error(err);
          alert("Failed to update status.");
        } finally {
          isUserInteracting = false;
          loadComplaints();
        }
      };
    };
    reader.readAsDataURL(file);
  }

  async function rejectComplaint(id) {
    if (!confirm('Reject this complaint?')) return;

    isUserInteracting = true;
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "reject", id: id })
    });
    isUserInteracting = false;
    loadComplaints();
  }

  function resetFilter() {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    isUserInteracting = false;
    loadComplaints();
  }

  function exportExcel() {
    if (!dataset.length) return alert('No data to export.');
    const ws = XLSX.utils.json_to_sheet(dataset);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Complaints");
    XLSX.writeFile(wb, `Maintenance_Report.xlsx`);
  }

  loadComplaints();
  setInterval(loadComplaints, 5000);
</script>

</body>
</html>
