<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Service Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --btn-brown: #5d3d1e;
      --btn-hover: #452c13;
      --input-bg: #f8fafc;
      --border-color: #e2e8f0;
      --focus-ring: rgba(93, 61, 30, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wrapper { width: 100%; max-width: 520px; position: relative; }

    /* Compact Globe Icon Language Picker */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
      position: relative;
    }

    .lang-icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--btn-brown);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      top: 36px;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      z-index: 100;
      overflow: hidden;
      min-width: 140px;
    }

    .lang-dropdown option {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .brand-header { text-align: center; margin-bottom: 20px; }

    .brand-logo-img {
      max-width: 130px;
      height: auto;
      margin-bottom: 8px;
      object-fit: contain;
    }

    .portal-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .portal-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--input-bg);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      background-color: #ffffff;
      border-color: var(--btn-brown);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    textarea { resize: vertical; min-height: 90px; }

    .btn-submit {
      width: 100%;
      background-color: var(--btn-brown);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover { background-color: var(--btn-hover); }
    .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .status-alert {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .status-pending { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .status-scheduled { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #93c5fd; }
    .status-resolved { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .status-rejected { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Globe Icon Bar -->
  <div class="top-bar">
    <div style="position:relative;">
      <button class="lang-icon-btn" onclick="toggleLangMenu()">
        🌐 <span id="currentLangLabel">EN</span> ▾
      </button>
      <select id="langSelect" class="lang-dropdown" size="4" onchange="selectLanguage(this.value)">
        <option value="en" selected>English</option>
        <option value="hi">हिंदी (Hindi)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="ml">മലയാളം (Malayalam)</option>
      </select>
    </div>
  </div>

  <div class="brand-header">
    <img src="logo.png" alt="Company Logo" class="brand-logo-img">
    <h1 class="portal-title" id="t-title">Submit TR Maintenance Complaints</h1>
  <h3 class="portal-subtitle" id="t-subtitle">Jebel Ali TR-03</h3>
  </div>

  <div class="card">
    <form id="complaintForm">
      <div class="form-group">
        <label for="techId" id="t-label-tech">👤Technician ID / Name</label>
        <input type="text" id="techId" placeholder="C12345 / ABC" >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="floorNumber" id="t-label-floor">🏢Floor <span style="color: red;">*</span></label>
          <select id="floorNumber" required>
            <option value="" id="opt-floor-select">Select</option>
            <option value="Ground Floor">Ground</option>
            <option value="Floor 1">Floor 1</option>
            <option value="Floor 2">Floor 2</option>
            <option value="Floor 3">Floor 3</option>
            <option value="Floor 4">Floor 4</option>
            <option value="Floor 5">Roof Top</option>
          </select>
        </div>

        <div class="form-group">
        <label for="roomNumber" id="t-label-room">🚪Room / Area <span style="color: red;">*</span></label>
        <input type="text" id="roomNumber" placeholder="Room 204 / Parking" required>
        </div>
      </div>

      <div class="form-group">
        <label for="category" id="t-label-cat">🛠️Category <span style="color: red;">*</span></label>
          <select id="category" required>
            <option value="" id="opt-cat-select">Select</option>
            <option value="Electrical" id="opt-elec">Electrical Issue</option>
            <option value="Plumbing" id="opt-plumb">Water Leakage</option>
            <option value="HVAC / AC" id="opt-hvac">AC Problem</option>
            <option value="Carpentry" id="opt-carp">Toilet Issue</option>
            <option value="Civil Work" id="opt-civil">Hygiene Issue</option>
            <option value="Other" id="opt-other">Other</option>
          </select>
      </div>

      <div class="form-group">
        <label for="description" id="t-label-desc">📝Complaint Description <span style="color: red;">*</span></label>
        <textarea id="description" placeholder="Describe what needs repair..." required></textarea>
      </div>

      <div class="form-group">
        <label for="photo" id="t-label-photo">📷Attach Photo</label>
        <input type="file" id="photo" accept="image/*">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Submit Request</button>
    </form>

    <div id="statusBox" class="status-alert"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyyTa1qfw_uDU3TnVg6KchVuH_3B1FjKMXsQVAcCY49zKGq32OLqadSGR9wcY39QGZj/exec";
  let activeComplaintId = null;

  const translations = {
    en: {
      lbl: "EN",
      title: "Submit Maintenance Issue",
      subtitle: "Quickly report workplace or facility issues",
      tech: "Technician ID / Name",
      floor: "Floor",
      cat: "Category",
      room: "Room / Location",
      desc: "Issue Details",
      photo: "Attach Photo (Optional)",
      submit: "Submit Request",
      submitting: "Submitting Request...",
      sel: "Select",
      elec: "Electrical", plumb: "Plumbing", hvac: "HVAC / AC", carp: "Carpentry", civil: "Civil Work", other: "Other"
    },
    hi: {
      lbl: "HI",
      title: "शिकायत दर्ज करें",
      subtitle: "कार्यस्थल की समस्याओं की रिपोर्ट करें",
      tech: "तकनीशियन आईडी / नाम",
      floor: "मंजिल (Floor)",
      cat: "श्रेणी (Category)",
      room: "कमरा / स्थान",
      desc: "समस्या का विवरण",
      photo: "फोटो संलग्न करें (वैकल्पिक)",
      submit: "शिकायत भेजें",
      submitting: "भेजा जा रहा है...",
      sel: "चुनें",
      elec: "बिजली (Electrical)", plumb: "प्लंबिंग", hvac: "एसी (AC/HVAC)", carp: "बढ़ईगीरी", civil: "सिविल काम", other: "अन्य"
    },
    ta: {
      lbl: "TA",
      title: "பராமரிப்பு புகாரை பதிவு செய்க",
      subtitle: "பணிவிடப் புகார்களை உடனடியாகப் புகாரளிக்கவும்",
      tech: "தொழில்நுட்ப வல்லுநர் ஐடி / பெயர்",
      floor: "தளம் (Floor)",
      cat: "வகை (Category)",
      room: "அறை / இடம்",
      desc: "பிரச்சனை விவரங்கள்",
      photo: "புகைப்படம் இணைக்கவும் (விருப்பம்)",
      submit: "சமர்ப்பிக்கவும்",
      submitting: "சமர்ப்பிக்கப்படுகிறது...",
      sel: "தேர்ந்தெடு",
      elec: "மின்சாரம்", plumb: "பிளம்பிங்", hvac: "ஏசி (AC)", carp: "மரவேலை", civil: "சிவில் வேலை", other: "மற்றவை"
    },
    ml: {
      lbl: "ML",
      title: "പരാതി രജിസ്റ്റർ ചെയ്യുക",
      subtitle: "തൊഴിൽ സ്ഥലത്തെ പ്രശ്നങ്ങൾ അറിയിക്കുക",
      tech: "ടെക്നീഷ്യൻ ഐഡി / പേര്",
      floor: "നില (Floor)",
      cat: "വിഭാഗം (Category)",
      room: "മുറി / സ്ഥലം",
      desc: "പ്രശ്ന വിവരണം",
      photo: "ഫോട്ടോ ചേർക്കുക (ഐച്ഛികം)",
      submit: "സമർപ്പിക്കുക",
      submitting: "സമർപ്പിക്കുന്നു...",
      sel: "തിരഞ്ഞെടുക്കുക",
      elec: "ഇലക്ട്രിക്കൽ", plumb: "പ്ലംബിംഗ്", hvac: "എസി (AC)", carp: "കാർപെന്ററി", civil: "സിവിൽ വർക്ക്", other: "മറ്റുള്ളവ"
    }
  };

  function toggleLangMenu() {
    const dropdown = document.getElementById('langSelect');
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  }

  function selectLanguage(lang) {
    document.getElementById('langSelect').style.display = 'none';
    const t = translations[lang] || translations.en;
    document.getElementById('currentLangLabel').innerText = t.lbl;
    document.getElementById('t-title').innerText = t.title;
    document.getElementById('t-subtitle').innerText = t.subtitle;
    document.getElementById('t-label-tech').innerText = t.tech;
    document.getElementById('t-label-floor').innerText = t.floor;
    document.getElementById('t-label-cat').innerText = t.cat;
    document.getElementById('t-label-room').innerText = t.room;
    document.getElementById('t-label-desc').innerText = t.desc;
    document.getElementById('t-label-photo').innerText = t.photo;
    document.getElementById('submitBtn').innerText = t.submit;
    
    document.getElementById('opt-floor-select').innerText = t.sel;
    document.getElementById('opt-cat-select').innerText = t.sel;
    document.getElementById('opt-elec').innerText = t.elec;
    document.getElementById('opt-plumb').innerText = t.plumb;
    document.getElementById('opt-hvac').innerText = t.hvac;
    document.getElementById('opt-carp').innerText = t.carp;
    document.getElementById('opt-civil').innerText = t.civil;
    document.getElementById('opt-other').innerText = t.other;
  }

  function compressImage(file, maxWidth, quality, callback) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = event => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        callback(canvas.toDataURL('image/jpeg', quality));
      };
    };
  }

  document.getElementById('complaintForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const lang = document.getElementById('langSelect').value;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = translations[lang].submitting;

    const file = document.getElementById('photo').files[0];

    const sendData = (fileData = null, fileName = null, mimeType = null) => {
      const payload = {
        action: "submit",
        techId: document.getElementById('techId').value,
        floor: document.getElementById('floorNumber').value,
        room: document.getElementById('roomNumber').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        fileData: fileData,
        fileName: fileName,
        mimeType: mimeType
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          activeComplaintId = res.id;
          const statusBox = document.getElementById('statusBox');
          statusBox.className = 'status-alert status-pending';
          statusBox.innerHTML = `Ticket <strong>${activeComplaintId}</strong> logged successfully.<br>Status: <strong>Pending Review</strong>`;
          statusBox.style.display = 'block';

          document.getElementById('complaintForm').reset();
        } else {
          alert("Error: " + (res.message || "Unable to save request"));
        }
      })
      .catch((error) => {
        console.error("Fetch Error:", error);
        alert("Submission failed. Please check connection.");
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = translations[lang].submit;
      });
    };

    if (file) {
      compressImage(file, 1024, 0.7, (compressedDataUrl) => {
        sendData(compressedDataUrl, file.name, 'image/jpeg');
      });
    } else {
      sendData();
    }
  });

  setInterval(async () => {
    if (!activeComplaintId) return;

    try {
      const response = await fetch(API_URL);
      const complaints = await response.json();
      const item = complaints.find(c => c.id === activeComplaintId);

      if (item) {
        const statusBox = document.getElementById('statusBox');
        if (item.status === 'Resolved') {
          statusBox.className = 'status-alert status-resolved';
          statusBox.innerHTML = `Ticket <strong>${activeComplaintId}</strong> is <strong>RESOLVED</strong>!`;
        } else if (item.status === 'Rescheduled') {
          statusBox.className = 'status-alert status-scheduled';
          statusBox.innerHTML = `Ticket <strong>${activeComplaintId}</strong> is <strong>RESCHEDULED</strong> for <strong>${item.scheduleDate}</strong>.<br>Reason: <i>${item.rescheduleReason || 'N/A'}</i>`;
        } else if (item.status === 'Rejected') {
          statusBox.className = 'status-alert status-rejected';
          statusBox.innerHTML = `Ticket <strong>${activeComplaintId}</strong> was <strong>REJECTED</strong>.`;
        }
      }
    } catch (e) { console.error(e); }
  }, 4000);
</script>

</body>
</html>
